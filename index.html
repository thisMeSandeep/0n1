<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An open-source system design lab that runs in your browser." />
    <meta name="color-scheme" content="light dark" />
    <title>0n1</title>
    <script>
      // Set the theme before first paint so there is no flash of the wrong theme.
      // The saved choice is mirrored into localStorage (see storage/preferences.ts).
      (() => {
        var choice = "system";
        try {
          choice = localStorage.getItem("0n1:theme") || "system";
        } catch {}
        var dark =
          choice === "dark" ||
          (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
